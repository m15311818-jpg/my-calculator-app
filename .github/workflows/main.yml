name: Build APK Muted

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04 # بيئة مستقرة متوافقة بالكامل

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # 🚀 الاستعانة بالأكشن الرسمي الجاهز والمقفل أمنياً وبرمجياً لبناء تطبيقات Kivy
    - name: Build Android APK with Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1
      with:
        command: buildozer android debug
        buildozer_version: stable

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator-apk
        path: bin/*.apk
